<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GIRO – Ciclismo Indoor</title>
<meta name="description" content="GIRO: aplicativo de ciclismo indoor para bicicletas ergométricas, spinning e simuladores. Supere seus limites.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GIRO">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/giro.css">
</head>
<body>
<div id="splash" role="presentation">
  <img src="img/logo-giro.png" alt="GIRO – Ciclismo Indoor. Supere seus limites." width="720" height="748">
</div>
<div id="app" class="app" hidden>
  <header class="topo">
    <span class="topo-nome">Ciclismo Indoor</span>
    <span id="chipRede" class="chip" data-estado="verificando" role="status" aria-live="polite">Verificando…</span>
  </header>
  <main id="v" class="v"></main>
  <nav id="nav" class="nav" hidden aria-label="Navegação principal"></nav>
  <div id="toast" class="toast" role="status" hidden></div>
  <div id="avisoAtualizacao" class="aviso" role="alert" hidden>
    <span>Nova versão do GIRO disponível.</span>
    <button id="btnAtualizar" type="button">Atualizar</button>
  </div>
</div>
<noscript><p class="noscript">O GIRO precisa do JavaScript ativado para funcionar.</p></noscript>
<script src="js/app.js"></script>
</body>
</html>
